<article class="founder-card">
  <div class="founder-header">
    <div class="founder-portrait"><img src="{{photo}}" alt="Retrato de {{name}}" width="{{photo_width}}" height="{{photo_height}}" loading="lazy" decoding="async"></div>
    <div class="founder-caption">
      <div><h4>{{name}}</h4><p class="eyebrow">Cofundador</p></div>
      <a class="founder-linkedin" href="{{linkedin}}" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn de {{name}} (abre em nova aba)">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" focusable="false"><path d="M20.45 0H3.55A3.55 3.55 0 0 0 0 3.55v16.9A3.55 3.55 0 0 0 3.55 24h16.9A3.55 3.55 0 0 0 24 20.45V3.55A3.55 3.55 0 0 0 20.45 0ZM7.12 20.45H3.56V9h3.56ZM5.34 7.43a2.06 2.06 0 1 1 0-4.12 2.06 2.06 0 0 1 0 4.12ZM20.45 20.45h-3.56v-5.57c0-1.33-.03-3.04-1.85-3.04-1.85 0-2.13 1.45-2.13 2.94v5.67H9.35V9h3.42v1.56h.05c.48-.91 1.64-1.87 3.37-1.87 3.6 0 4.26 2.37 4.26 5.46Z"/></svg>
      </a>
    </div>
  </div>
  <div class="founder-bio">{{bio}}</div>
</article>
