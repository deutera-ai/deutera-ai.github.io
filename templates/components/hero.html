<section class="hero {{hero_class}}" id="inicio" aria-labelledby="hero-title">
  {{diagram}}
  <div class="container hero-content">
    <p class="eyebrow"><span class="signal" aria-hidden="true"></span>{{eyebrow}}</p>
    <h1 id="hero-title">{{title}}</h1>
    <p class="hero-description">{{description}}</p>
    <div class="actions"><a class="button button-primary" href="{{primary_link}}">{{primary_label}} <span aria-hidden="true">↗</span></a><a class="button button-secondary" href="{{secondary_link}}">{{secondary_label}} <span aria-hidden="true">↓</span></a></div>
    <p class="hero-caption">{{caption}}</p>
  </div>
</section>
