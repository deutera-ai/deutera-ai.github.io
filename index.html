<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101815">
  <meta name="description" content="Deutera. Tecnologia e inteligência artificial. Nosso site está em construção.">
  <title>Deutera — Em construção</title>
  <style>
    :root { color-scheme: dark; --bg:#101815; --paper:#f4f2e9; --soft:#b9c2b9; --accent:#d6eea5; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100svh; background:var(--bg); color:var(--paper); font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    .page { min-height:100svh; max-width:1440px; margin:auto; padding:40px clamp(24px,7vw,100px) 28px; display:flex; flex-direction:column; position:relative; overflow:hidden; }
    .page::before { content:""; position:absolute; width:540px; height:540px; right:-250px; top:13%; border:1px solid #d6eea522; border-radius:50%; box-shadow:0 0 0 80px #d6eea507,0 0 0 160px #d6eea504; pointer-events:none; }
    header { display:flex; align-items:center; justify-content:space-between; gap:20px; position:relative; }
    .brand { font-size:28px; font-weight:650; letter-spacing:-1.4px; }
    .brand span { color:var(--accent); }
    .status { border:1px solid #899b8245; border-radius:100px; padding:9px 14px; font-size:12px; color:var(--soft); display:flex; align-items:center; gap:9px; white-space:nowrap; }
    .status::before { content:""; width:6px; height:6px; background:var(--accent); border-radius:50%; }
    main { flex:1; display:flex; flex-direction:column; justify-content:center; align-items:flex-start; padding:100px 0 110px; position:relative; }
    .eyebrow { font-size:11px; letter-spacing:2.5px; text-transform:uppercase; color:var(--accent); margin:0 0 30px; line-height:1.8; }
    h1 { font-weight:450; font-size:clamp(46px,6.4vw,88px); line-height:1.06; letter-spacing:-.055em; margin:0; max-width:900px; text-wrap:balance; }
    h1 span { color:var(--accent); }
    .description { max-width:470px; font-size:clamp(16px,1.5vw,19px); color:var(--soft); line-height:1.75; margin:32px 0 0; }
    .note { display:flex; align-items:center; gap:12px; margin-top:42px; color:var(--paper); font-size:13px; }
    .note::before { content:""; display:block; width:28px; height:1px; background:var(--accent); }
    footer { display:flex; justify-content:space-between; gap:16px; flex-wrap:wrap; border-top:1px solid #899b8233; padding-top:22px; color:var(--soft); font-size:12px; line-height:1.8; position:relative; }
    footer p { margin:0; }
    a { color:inherit; text-underline-offset:4px; }
    a:hover { color:var(--accent); }
    a:focus-visible { outline:2px solid var(--accent); outline-offset:5px; border-radius:2px; }
    @media(max-width:550px) { .page { padding-top:26px; } .brand { font-size:25px; } .status { padding:7px 10px; font-size:11px; } main { padding:85px 0; } h1 { font-size:clamp(42px,11vw,60px); } .page::before { right:-420px; } .eyebrow { max-width:260px; } }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <div class="brand" aria-label="Deutera">deutera<span>.</span></div>
      <div class="status">Site em construção</div>
    </header>
    <main>
      <p class="eyebrow">Tecnologia &amp; inteligência artificial</p>
      <h1>Ideias que ganham<br><span>novas possibilidades.</span></h1>
      <p class="description">Estamos preparando nosso espaço. Em breve, você vai conhecer a Deutera e o que estamos construindo.</p>
      <p class="note">Nos vemos em breve.</p>
    </main>
    <footer>
      <p>© Deutera</p>
      <p><a href="https://github.com/deutera-ai">Acompanhe no GitHub ↗</a></p>
    </footer>
  </div>
</body>
</html>
